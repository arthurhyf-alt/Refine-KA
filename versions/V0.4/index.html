<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>产业自动筛查器</title>
  <style>
    :root{--ink:#17312b;--muted:#657570;--green:#3f9d5a;--red:#d85d49;--bg:#f5f7f4;--card:#fff;--line:#dfe7e2;--amber:#c88720}
    *{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:26px 34px 20px;background:#173f34;color:white;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
    h1{margin:0 0 6px;font-size:30px} header p{margin:0;color:#c7ded5}.fresh{font-size:13px;color:#a8c8bc}
    main{padding:24px 34px 48px;max-width:1500px;margin:auto}.toolbar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;align-items:center}
    select,button,input{font:inherit} select,button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:white;color:var(--ink)} button{cursor:pointer;font-weight:700} button.primary{background:var(--green);border-color:var(--green);color:white}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(160px,1fr));gap:14px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}.card label{font-size:13px;color:var(--muted)}.card strong{display:block;font-size:28px;margin-top:5px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel h2{font-size:18px;margin:0;padding:17px 19px;border-bottom:1px solid var(--line)}
    table{width:100%;border-collapse:collapse}th,td{padding:12px 13px;border-bottom:1px solid #edf1ee;text-align:left;font-size:14px}th{position:sticky;top:0;background:#f8faf8;color:var(--muted);font-size:12px}tr:hover{background:#f5faf6}.industry{font-weight:700}.score{font-size:19px;font-weight:800}.high{color:var(--green)}.low{color:var(--red)}
    .tier{padding:4px 8px;border-radius:999px;background:#edf6ef;font-size:12px;font-weight:700}.coverage{color:var(--muted);font-size:12px}.bar{height:7px;background:#edf1ee;border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--green)}
    .weights{padding:8px 18px 20px}.weight{display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:center;margin-top:13px}.weight input[type=range]{grid-column:1/3;width:100%;accent-color:var(--green)}.weight span{color:var(--muted);font-size:13px}.weight output{text-align:right;font-weight:800}
    .detail{margin-top:18px;padding:0 18px 20px}.detail h3{margin:14px 0 4px}.metric{border-top:1px solid var(--line);padding:12px 0}.metric-head{display:flex;justify-content:space-between;font-weight:700}.metric small{color:var(--muted);display:block;margin-top:4px;line-height:1.5}.empty{padding:50px;text-align:center;color:var(--muted)}
    .hint{font-size:12px;color:var(--muted);padding:0 19px 15px}.file{display:none}.status{font-size:13px;color:var(--muted);margin-left:auto}.status.running{color:var(--amber);font-weight:700}.status.ok{color:var(--green)}.mode-banner{padding:12px 15px;border-radius:9px;margin:-4px 0 18px;background:#fff4d9;border:1px solid #ead49a;color:#73591c;font-size:14px}.mode-banner.pipeline{background:#e9f6ec;border-color:#bde0c4;color:#245f32}.mode-banner.imported{background:#eaf2fb;border-color:#c7d9ef;color:#2c557f}.evidence-title{margin-top:8px!important}.source-link{display:inline-block;margin:4px 8px 0 0;color:#287a43}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:24px;z-index:20}.modal.open{display:flex}.modal-card{background:white;border-radius:14px;max-width:920px;width:100%;max-height:84vh;overflow:auto;padding:22px}.modal-card.wide{max-width:1250px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.modal-head h2{margin:0}.modal-head button{font-size:20px}.source-row{padding:14px 0;border-top:1px solid var(--line)}.source-row b{display:block;margin-bottom:4px}.source-row small{color:var(--muted)}.section-title{margin:24px 0 8px}.signal-up{color:var(--green);font-weight:800}.signal-watch{color:var(--amber);font-weight:800}.method{background:#f2f6f3;border-left:4px solid var(--green);padding:12px 14px;line-height:1.6}.compact td,.compact th{vertical-align:top}.compact small{color:var(--muted);line-height:1.5}.badge-a{display:inline-block;padding:2px 7px;border-radius:999px;background:#e6f4ea;color:#287a43;font-size:11px;font-weight:800}@media(max-width:980px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}@media(max-width:620px){main{padding:16px}.summary{grid-template-columns:1fr 1fr}.hide-mobile{display:none}.status{width:100%;margin:0}}
  </style>
</head>
<body>
  <header><div><h1>产业自动筛查器</h1><p>七维评分 · 细分行业 · 企业分化 · 合作对象</p></div><div class="fresh">MVP 0.4｜数据保存在本机浏览器</div></header>
  <main>
    <div class="toolbar">
      <select id="region"></select><select id="tier"><option value="">全部评级</option><option>优先关注</option><option>持续观察</option><option>中性</option><option>谨慎</option></select>
      <button class="primary" id="runBtn">抓取最新公开数据</button><button id="exportAnalysisBtn">出口细分与合作对象</button><button id="loadPipelineBtn">载入采集结果</button><button id="sourcesBtn">查看数据来源</button><button id="importBtn">导入CSV</button><button id="exportBtn">导出当前数据</button><button id="resetBtn">恢复示例数据</button><span class="status" id="pipelineStatus">尚未检查采集状态</span><input class="file" id="file" type="file" accept=".csv,text/csv" />
    </div>
    <div class="mode-banner" id="modeBanner"></div>
    <section class="summary"><div class="card"><label>纳入行业</label><strong id="count">—</strong></div><div class="card"><label>优先关注</label><strong id="priority">—</strong></div><div class="card"><label>平均综合分</label><strong id="average">—</strong></div><div class="card"><label>平均数据覆盖率</label><strong id="coverage">—</strong></div></section>
    <div class="layout">
      <section class="panel"><h2>行业排名</h2><div id="table"></div><p class="hint">点击行业查看七维得分和证据。综合分已按可信度折算；数据缺失会降低覆盖率。</p></section>
      <aside class="panel"><h2>行业证据与来源</h2><div class="detail" id="detail"><p class="empty">点击左侧行业查看证据</p></div><h2 class="evidence-title">评分权重</h2><div class="weights" id="weights"></div></aside>
    </div>
  </main>
  <div class="modal" id="sourcesModal"><div class="modal-card"><div class="modal-head"><h2>已配置的数据来源</h2><button id="closeSources">×</button></div><p class="coverage">这里只列出采集器会访问的来源。实际是否成功采集，请以页面顶部的运行状态为准。</p><div id="sourcesList"></div></div></div>
  <div class="modal" id="exportAnalysisModal"><div class="modal-card wide"><div class="modal-head"><div><h2>出口细分与潜在合作对象</h2><p class="coverage" id="exportMeta"></p></div><button id="closeExportAnalysis">×</button></div><div id="exportAnalysisBody"></div></div></div>
  <script type="module">
    import { DIMENSIONS, rankIndustries, parseCsv, toCsv } from './scoring.js';
    import { sampleData } from './data/sample-data.js';
    const $=s=>document.querySelector(s);
    let records=JSON.parse(localStorage.getItem('industryRecords')||'null')||structuredClone(sampleData);
    let weights=JSON.parse(localStorage.getItem('industryWeights')||'null')||Object.fromEntries(DIMENSIONS.map(d=>[d.key,d.defaultWeight]));
    let selectedId=null;
    let dataMode=localStorage.getItem('industryDataMode')||'sample';
    function save(){localStorage.setItem('industryRecords',JSON.stringify(records));localStorage.setItem('industryWeights',JSON.stringify(weights));localStorage.setItem('industryDataMode',dataMode);}
    function renderMode(){const el=$('#modeBanner');const content=dataMode==='pipeline'?['pipeline','当前显示：自动采集结果。点击行业可查看抓取原文和来源链接。']:dataMode==='imported'?['imported','当前显示：你导入的CSV数据。来源取决于CSV中的 evidence 字段。']:['','当前显示：内置演示数据，仅用于测试评分功能，其中招聘、技术等部分分数是占位示例，不能作为正式结论。请先运行自动采集并载入结果。'];el.className=`mode-banner ${content[0]}`;el.textContent=content[1]}
    function regions(){const required=['全国','上海','江西','福建','浙江'];return ['全部地区',...required,...new Set(records.map(r=>r.region).filter(r=>!required.includes(r)))]}
    function renderRegions(){const current=$('#region').value||'全部地区';$('#region').innerHTML=regions().map(r=>`<option ${r===current?'selected':''}>${r}</option>`).join('')}
    function renderWeights(){
      $('#weights').innerHTML=DIMENSIONS.map(d=>`<div class="weight"><span>${d.label}</span><output>${weights[d.key]}</output><input data-key="${d.key}" type="range" min="0" max="30" value="${weights[d.key]}"></div>`).join('');
      document.querySelectorAll('.weight input').forEach(el=>el.oninput=e=>{weights[e.target.dataset.key]=Number(e.target.value);e.target.previousElementSibling.textContent=e.target.value;save();render()});
    }
    function filtered(){const region=$('#region').value,tier=$('#tier').value;return rankIndustries(records,weights).filter(r=>(region==='全部地区'||r.region===region)&&(!tier||r.tier===tier))}
    function render(){renderMode();
      const rows=filtered();$('#count').textContent=rows.length;$('#priority').textContent=rows.filter(r=>r.tier==='优先关注').length;$('#average').textContent=rows.length?(rows.reduce((s,r)=>s+r.totalScore,0)/rows.length).toFixed(1):'—';$('#coverage').textContent=rows.length?Math.round(rows.reduce((s,r)=>s+r.coverage,0)/rows.length*100)+'%':'—';
      $('#table').innerHTML=rows.length?`<table><thead><tr><th>#</th><th>行业</th><th>地区</th><th>综合分</th><th>评级</th><th class="hide-mobile">覆盖率</th></tr></thead><tbody>${rows.map((r,i)=>`<tr data-id="${r.id}"><td>${i+1}</td><td><div class="industry">${r.industry}</div><div class="coverage">更新 ${r.updatedAt}</div></td><td>${r.region}</td><td><span class="score ${r.totalScore>=65?'high':r.totalScore<45?'low':''}">${r.totalScore.toFixed(1)}</span></td><td><span class="tier">${r.tier}</span></td><td class="hide-mobile">${Math.round(r.coverage*100)}%<div class="bar"><i style="width:${r.coverage*100}%"></i></div></td></tr>`).join('')}</tbody></table>`:'<p class="empty">没有符合条件的行业</p>';
      document.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>{selectedId=tr.dataset.id;renderDetail()});renderDetail();
    }
    function renderDetail(){const r=rankIndustries(records,weights).find(x=>x.id===selectedId);if(!r){$('#detail').innerHTML='<p class="empty">点击左侧行业查看证据</p>';return}$('#detail').innerHTML=`<h3>${r.industry}</h3><div class="coverage">${r.region}｜综合分 ${r.totalScore.toFixed(1)}｜覆盖率 ${Math.round(r.coverage*100)}%</div>${DIMENSIONS.map(d=>{const m=r.breakdown[d.key],metric=r.metrics[d.key]||{},source=metric.evidence||'暂无证据',links=(metric.evidenceItems||[]).map(x=>`<a class="source-link" href="${x.url}" target="_blank" rel="noreferrer">↗ ${x.source}</a>`).join('');return `<div class="metric"><div class="metric-head"><span>${d.label}</span><span>${m.observed?Number(m.raw).toFixed(0):'缺失'} → ${m.effective.toFixed(1)}</span></div><small>可信度 ${Math.round(m.confidence*100)}%<br>${source}${links?`<br>${links}`:''}</small></div>`}).join('')}`}
    async function checkPipelineStatus(){try{const response=await fetch('/api/pipeline/status',{cache:'no-store'});if(!response.ok)throw new Error(`状态接口 ${response.status}`);const status=await response.json(),el=$('#pipelineStatus');if(status.running){el.textContent='正在抓取和解析数据…';el.className='status running';$('#runBtn').disabled=true;setTimeout(checkPipelineStatus,2000)}else{$('#runBtn').disabled=false;if(status.status==='never_run'){el.textContent='尚未运行自动采集';el.className='status'}else if(status.status==='network_blocked'){el.textContent='当前运行环境无法联网｜保留最近核验结果';el.className='status';el.title=status.error||'';el.onclick=()=>alert(status.error||'当前运行环境无法联网')}else if(status.status==='failed'){el.textContent=`采集失败：0/${status.sourceCount||0}个来源。点击此处查看原因`;el.className='status';el.title=status.error||'未知错误';el.onclick=()=>alert((status.error||'未知错误').split('\n').slice(0,3).join('\n'))}else{el.textContent=`最近采集：${status.successCount||0}/${status.sourceCount||0}个来源，${status.observationCount||0}条观测`;el.className='status ok';el.onclick=null}}}catch(error){const el=$('#pipelineStatus');el.textContent='无法读取采集状态，点击查看原因';el.onclick=()=>alert(error.message)}}
    async function loadPipelineResults(){const imported=await fetch('/api/pipeline/results',{cache:'no-store'}).then(r=>r.json());if(!imported.length){alert('还没有可用的采集结果，请先点击“抓取最新公开数据”。');return}records=imported;dataMode='pipeline';selectedId=null;save();renderRegions();render();}
    $('#runBtn').onclick=async()=>{const response=await fetch('/api/pipeline/run',{method:'POST'});const result=await response.json();if(!response.ok&&response.status!==409)alert(result.message||'启动失败');checkPipelineStatus()};$('#loadPipelineBtn').onclick=loadPipelineResults;
    $('#region').onchange=render;$('#tier').onchange=render;$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const text=await e.target.files[0].text();const imported=parseCsv(text);if(imported.length){records=imported;dataMode='imported';selectedId=null;save();renderRegions();render()}e.target.value=''};
    $('#exportBtn').onclick=()=>{const blob=new Blob(['\uFEFF'+toCsv(records)],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='产业筛查数据.csv';a.click();URL.revokeObjectURL(a.href)};
    $('#resetBtn').onclick=()=>{if(confirm('恢复示例数据并清除当前导入内容？')){records=structuredClone(sampleData);dataMode='sample';weights=Object.fromEntries(DIMENSIONS.map(d=>[d.key,d.defaultWeight]));selectedId=null;save();renderRegions();renderWeights();render()}};
    $('#sourcesBtn').onclick=async()=>{try{const response=await fetch('/api/sources',{cache:'no-store'});if(!response.ok)throw new Error(`来源接口返回 ${response.status}`);const sources=await response.json(),mode={auto:'固定源自动采集',auto_discovered:'自动发现并采集',manual_captcha:'需验证码，人工导入',manual_query:'需查询，人工导入'};$('#sourcesList').innerHTML=sources.map(s=>`<div class="source-row"><b>${s.name}</b><small>${s.region}｜维度：${DIMENSIONS.find(d=>d.key===s.dimension)?.label||s.dimension}｜来源等级 ${s.source_grade}｜${mode[s.collection_mode]||'自动采集'}｜${s.enabled===false?'候选源':'已接入'}</small>${s.metric?`<small>采集指标：${s.metric}</small>`:''}<br><a href="${s.url}" target="_blank" rel="noreferrer">${s.url}</a></div>`).join('');$('#sourcesModal').classList.add('open')}catch(error){alert(`数据来源暂时无法显示：${error.message}\n请关闭旧版程序后重新启动 MVP 0.3。`)}};$('#closeSources').onclick=()=>$('#sourcesModal').classList.remove('open');$('#sourcesModal').onclick=e=>{if(e.target.id==='sourcesModal')e.currentTarget.classList.remove('open')};
    $('#exportAnalysisBtn').onclick=async()=>{try{const d=await fetch('/api/export-analysis',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`接口 ${r.status}`);return r.json()});$('#exportMeta').textContent=`数据期：${d.asOf}｜口径：${d.scope}`;const growth=d.verifiedGrowth.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.industry}</b><br><span class="badge-a">来源等级 ${x.evidenceLevel}</span></td><td><span class="signal-up">+${x.growth.toFixed(1)}%</span><br><small>${x.metric}</small></td><td><small>${x.structure}</small></td><td><small><b>龙头：</b>${x.largeEnterprise}<br><b>中小企业：</b>${x.sme}</small></td><td><b>${x.partnership}</b><br><a href="${x.url}" target="_blank" rel="noreferrer">原始来源</a></td></tr>`).join('');const decline=d.verifiedDecline.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.industry}</b><br><span class="badge-a">来源等级 ${x.evidenceLevel}</span></td><td><span class="low"><b>${x.growth.toFixed(1)}%</b></span><br><small>${x.metric}</small></td><td><small>${x.structure}</small></td><td><small><b>龙头：</b>${x.largeEnterprise}<br><b>中小企业：</b>${x.sme}</small></td><td><b>${x.partnership}</b><br><a href="${x.url}" target="_blank" rel="noreferrer">原始来源</a></td></tr>`).join('');const rules=d.enterpriseRules.map(x=>`<tr><td>${x.signal}</td><td>${x.judgement}</td><td><b>${x.action}</b></td></tr>`).join('');$('#exportAnalysisBody').innerHTML=`<p class="method"><b>提取规则：</b>${d.method}</p><h3 class="section-title">已核验的增长行业</h3><table class="compact"><thead><tr><th>#</th><th>细分行业</th><th>2026上半年</th><th>企业分化判断</th><th>潜在合作对象</th><th>合作优先级</th></tr></thead><tbody>${growth}</tbody></table><h3 class="section-title">已核验的下降行业</h3><table class="compact"><thead><tr><th>#</th><th>细分行业</th><th>2026上半年</th><th>企业分化判断</th><th>潜在合作对象</th><th>合作优先级</th></tr></thead><tbody>${decline}</tbody></table><h3 class="section-title">企业层级判定规则</h3><table class="compact"><thead><tr><th>组合信号</th><th>判断</th><th>合作动作</th></tr></thead><tbody>${rules}</tbody></table>`;$('#exportAnalysisModal').classList.add('open')}catch(e){alert(`出口细分暂时无法显示：${e.message}\n请重新启动程序。`)}};$('#closeExportAnalysis').onclick=()=>$('#exportAnalysisModal').classList.remove('open');$('#exportAnalysisModal').onclick=e=>{if(e.target.id==='exportAnalysisModal')e.currentTarget.classList.remove('open')};
    renderRegions();renderWeights();render();checkPipelineStatus();loadPipelineResults().catch(()=>{});
  </script>
</body></html>
